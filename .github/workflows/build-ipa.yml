name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build unsigned .ipa
        run: |
          chmod +x Scripts/build-ipa.sh
          ./Scripts/build-ipa.sh --clean

      - name: Inspect package
        run: |
          ls -lh dist/
          unzip -l dist/*.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Radar-ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          generate_release_notes: true
